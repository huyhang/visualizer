[project]
name = "visualizer"
version = "0.1.0"
description = "A short description of your project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.2",
    "pymongo>=4.0",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    # Chronos builds each book's story graph in-process (convergence/divergence,
    # reachability); pure-Python, no server or extra container.
    "networkx>=3.0",
]

[project.optional-dependencies]
# jsonschema backs the OpenAPI contract test (tests/chronos/test_contract.py).
dev = ["pytest", "ruff", "mongomock>=4.1", "jsonschema>=4.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests/akasha", "tests/chronos"]
# `src` is on the path for package imports. `tests/akasha` stays a
# non-package dir so its historical bare `from conftest import ...` keeps working.
# `tests/chronos` is a package (has __init__.py), so its conftest is namespaced
# as `tests.chronos.conftest` -- no clash with the other suite's conftest; the
# repo root (".") is on the path so that package resolves.
pythonpath = ["src", ".", "tests/akasha"]
