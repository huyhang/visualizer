[project]
name = "visualizer"
version = "0.1.0"
description = "A short description of your project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.2",
    "pymongo>=4.0",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    # Per-IP rate limiting on the auth endpoints (login/register/change-password).
    "flask-limiter>=3.5",
    # Chronos builds each book's story graph in-process (convergence/divergence,
    # reachability); pure-Python, no server or extra container.
    "networkx>=3.0",
]

[project.optional-dependencies]
# jsonschema backs the OpenAPI contract test (tests/chronos/test_contract.py).
# nodejs-wheel-binaries ships a node binary as a wheel, so the handful of pure
# browser modules with real logic in them (the story map's slicing, folding and
# layout) can be exercised from pytest -- see tests/chronos/test_graph_js.py.
# Declared here rather than installed by hand so it is a fact about the repo and
# not about one machine: whatever env runs the tests gets node from the same
# `pip install -e ".[dev]"` that gets it pytest.
dev = [
    "pytest", "ruff", "mongomock>=4.1", "jsonschema>=4.0",
    "nodejs-wheel-binaries>=20",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests/akasha", "tests/chronos", "tests/prithvi"]
# `src` is on the path for package imports. `tests/akasha` stays a
# non-package dir so its historical bare `from conftest import ...` keeps working.
# `tests/chronos` and `tests/prithvi` are packages (they have `__init__.py`), so
# their conftests are namespaced as `tests.<service>.conftest` -- no clash with
# the other suite's conftest; the repo root (".") is on the path so those
# packages resolve.
pythonpath = ["src", ".", "tests/akasha"]
