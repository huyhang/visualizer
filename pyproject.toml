[project]
name = "visualizer"
version = "0.1.0"
description = "A short description of your project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["flask>=2.2", "pymongo>=4.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mongomock>=4.1"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests/document-server"]
# The document-server code lives in a hyphenated directory, so it is imported as
# flat top-level modules (app, store, ...) from this source root rather than as
# a package.
pythonpath = ["src/visualizer/document-server", "tests/document-server"]
