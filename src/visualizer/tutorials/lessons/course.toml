# The course: what the hub shows, and the order the lessons are read in.
#
# Each lesson named here is <slug>.toml beside this file. The prelude is read
# first and has no number; the parts' lessons are numbered in order.

title = "From first article to first draft"
lede = "Short lessons, in order. Each one takes a few minutes and leaves you with something real in your own story."
prelude = "before-you-start"

[[parts]]
slug = "your-world"
kicker = "Part 1 · in Articles"
title = "Your world"
blurb = "The people, places and things your story is about."
mark = "akasha"
lessons = ["a-home-for-your-story", "your-first-article", "places-and-people"]

[[parts]]
slug = "your-story"
kicker = "Part 2 · in Timeline and Maps"
title = "Your story's shape"
blurb = "What happens, where, and in what order."
mark = "chronos"
lessons = ["start-a-book", "your-first-scene", "threads-through-the-story", "consistent-or-conflicted", "draw-the-world"]

[[parts]]
slug = "your-draft"
kicker = "Part 3 · in Manuscripts"
title = "Your draft"
blurb = "Turn the plan into prose, a chapter at a time."
mark = "logos"
lessons = ["start-writing", "the-writing-page", "your-world-beside-you", "chapter-after-chapter", "read-it-back", "a-first-draft"]
