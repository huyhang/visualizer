<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akasha</title>
  <link rel="icon" href="{{ url_for('static', filename='akasha-icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
  <script>
    // Set the theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem("akasha-theme") || localStorage.getItem("kb-theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
      try {
        var fs = parseInt(localStorage.getItem("akasha-fontscale")
                          || localStorage.getItem("kb-fontscale"), 10);
        if (fs) document.documentElement.style.fontSize = fs + "px";
      } catch (e) { /* ignore */ }
      try {
        var w = parseInt(localStorage.getItem("akasha-sidebar"), 10);
        if (w) document.documentElement.style.setProperty("--sidebar-w", w + "px");
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Toggle browser">☰</button>
    <a class="brand" id="home-link" href="#/" title="All {{ terms.database.many }}"><span class="mark"><img src="{{ url_for('static', filename='akasha-glyph.svg') }}" alt="" width="26" height="26"></span><span class="brand-name">Akasha</span></a>
    <div class="header-actions">
      <nav class="service-switch" aria-label="Switch service">
        <a href="{{ service_links.akasha }}"{% if service_links.current == 'akasha' %} class="active" aria-current="page"{% endif %}>Articles</a>
        <a href="{{ service_links.chronos }}"{% if service_links.current == 'chronos' %} class="active" aria-current="page"{% endif %}>Timeline</a>
        <a href="{{ service_links.prithvi }}"{% if service_links.current == 'prithvi' %} class="active" aria-current="page"{% endif %}>Maps</a>
        {% if current_user.is_admin %}<a href="{{ service_links.admin }}">Admin</a>{% endif %}
      </nav>
      <button class="icon-btn font-btn" id="font-toggle" aria-label="Text size" title="Text size">A</button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark">◐</button>
      <a class="header-link" href="{{ url_for('account_page') }}">Account</a>
      <span class="userchip"><span class="avatar">{{ current_user.username[0] | upper }}</span>
        <span class="username">{{ current_user.username }}</span></span>
      <form class="inline-form" method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link-btn" type="submit">Log out</button>
      </form>
    </div>
  </header>

  <div class="app-body">
    <div class="scrim" id="scrim" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Browser">
      <div class="sidebar-head">
        <input type="search" id="search-box" placeholder="Search titles…" autocomplete="off">
        <button class="btn sm" id="new-article-btn" title="New article">＋ New</button>
      </div>
      <div class="search-results" id="search-results" hidden
           aria-label="Matches"></div>
      <nav class="tree" id="tree" aria-label="{{ terms.database.Many }}"></nav>
      <div class="sidebar-resize" id="sidebar-resize" role="separator"
           aria-orientation="vertical" aria-label="Resize the browser"></div>
    </aside>

    <main class="content" id="content">
      <!-- Every route renders here: the grid of worlds, one world's categories,
           one category's article list, or one article. -->
      <article class="pane" id="pane"></article>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
