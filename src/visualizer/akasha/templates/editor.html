<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akasha</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
  <script>
    // Set the theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem("akasha-theme") || localStorage.getItem("kb-theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
      try {
        var fs = parseInt(localStorage.getItem("akasha-fontscale")
                          || localStorage.getItem("kb-fontscale"), 10);
        if (fs) document.documentElement.style.fontSize = fs + "px";
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Toggle browser">☰</button>
    <span class="brand"><span class="mark">AK</span><span class="brand-name">Akasha</span></span>
    <div class="header-actions">
      <button class="icon-btn font-btn" id="font-toggle" aria-label="Text size" title="Text size">A</button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark">◐</button>
      {% if current_user.is_admin %}<a class="header-link" href="{{ url_for('admin_page') }}">Admin</a>{% endif %}
      <span class="userchip"><span class="avatar">{{ current_user.username[0] | upper }}</span>
        <span class="username">{{ current_user.username }}</span></span>
      <form class="inline-form" method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link-btn" type="submit">Log out</button>
      </form>
    </div>
  </header>

  <div class="app-body">
    <div class="scrim" id="scrim" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Browser">
      <div class="sidebar-head">
        <input type="search" id="search-box" placeholder="Search titles…" autocomplete="off">
        <button class="btn sm" id="new-article-btn" title="New article">＋ New</button>
      </div>
      <nav class="tree" id="tree" aria-label="Databases"></nav>
    </aside>

    <main class="content" id="content">
      <div class="empty-state" id="empty-state">
        <div class="empty-mark">AK</div>
        <p>Select an article from the browser, or create a new one.</p>
      </div>
      <article class="pane" id="pane" hidden></article>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
