{% extends "base.html" %}
{% block title %}Log in — Akasha{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('do_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <button class="btn-full" type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:1rem">
    {% if registration_open %}
    No account? <a href="{{ url_for('register_page') }}">Register</a>.
    {% else %}
    Registration is invite-only — ask an administrator for an account.
    {% endif %}
  </p>
</div>
{% endblock %}
