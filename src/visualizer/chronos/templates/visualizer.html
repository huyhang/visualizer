<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chronos — plotline visualiser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='visualizer.css') }}">
  <script>
    // Set theme + font size before first paint to avoid a flash of the wrong one.
    (function () {
      try {
        var saved = localStorage.getItem("chronos-theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
      try {
        var fs = parseInt(localStorage.getItem("chronos-fontscale"), 10);
        if (fs) document.documentElement.style.fontSize = fs + "px";
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <span class="brand"><span class="mark">C</span><span class="brand-name">Chronos</span></span>
    <nav class="service-switch" aria-label="Switch service">
      <a href="{{ service_links.akasha }}"{% if service_links.current == 'akasha' %} class="active" aria-current="page"{% endif %}>Articles</a>
      <a href="{{ service_links.chronos }}"{% if service_links.current == 'chronos' %} class="active" aria-current="page"{% endif %}>Timeline</a>
      {% if current_user.is_admin %}<a href="{{ service_links.admin }}">Admin</a>{% endif %}
    </nav>
    <div class="header-actions">
      <button class="icon-btn font-btn" id="font-toggle" aria-label="Text size" title="Text size">A</button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark">◐</button>
      <span class="userchip"><span class="avatar">{{ current_user.username[0] | upper }}</span>
        <span class="username">{{ current_user.username }}</span></span>
      <form class="inline-form" method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="link-btn" type="submit">Log out</button>
      </form>
    </div>
  </header>

  <main class="content" id="content"></main>

  <div class="peek" id="peek" aria-live="polite"></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
