<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Which faces the screenshot image (docker/Dockerfile.shots) draws pages in.

  The stack's sheets name the platform's own faces (system-ui and Georgia), so
  on Linux everything would otherwise fall through to whatever happens to be
  installed. These stand in for what a writer on a Mac or a phone sees.
  "strong" is what makes Chromium accept a substitute under the name it asked
  for, rather than skipping on down the font stack.

  No double hyphens anywhere in this comment: XML forbids them inside one, and
  fontconfig then ignores the whole file without failing the build.
-->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Georgia</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
