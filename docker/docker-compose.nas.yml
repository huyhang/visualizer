# The stack: akasha + chronos + MongoDB.
#
# Built on slim python images (docker/Dockerfile.*) and marked
# `restart: unless-stopped` so it survives NAS reboots. This is the only
# compose file — it serves local development and the NAS alike.
#
# Deploy (from the repo root on the NAS):
#   SECRET_KEY is required — put it in docker/.env (auto-loaded), e.g.
#     SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
#   Then, in Synology Container Manager, create a Project pointing at this file,
#   or on the CLI:
#     docker compose -f docker/docker-compose.nas.yml up --build -d
#
# Ports (DSM itself uses 5000/5001, so those are avoided):
#   5002 -> akasha  (articles/entities)
#   5003 -> chronos (plotlines/timeline)
# Both share one MongoDB and one SECRET_KEY, so a single login works across
# them (one identity, one `_auth` grant store). Put them behind Synology's
# reverse proxy for HTTPS, then set SESSION_COOKIE_SECURE=true in docker/.env.
name: visualizer

services:
  akasha:
    build:
      context: ..
      dockerfile: docker/Dockerfile.akasha
    ports:
      - "5002:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — set it in docker/.env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      VERSIONS_KEEP: ${VERSIONS_KEEP:-20}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  chronos:
    # The plotline & timeline API. Shares mongo (entities live in
    # akasha) and the same SECRET_KEY so one session covers both.
    build:
      context: ..
      dockerfile: docker/Dockerfile.chronos
    ports:
      - "5003:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — set it in docker/.env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    # mongo:7 requires AVX — fine on the DS1621+ (Ryzen V1500B). On a CPU without
    # AVX (e.g. some Celeron models), change this to mongo:4.4.
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  # Pinned to its original name so the rename to `akasha` (and the compose
  # project rename to `visualizer`) does not orphan existing data -- compose
  # derives volume names from the project name, so without this the stack would
  # silently come up against an empty database.
  mongo-data:
    name: document-server_mongo-data
