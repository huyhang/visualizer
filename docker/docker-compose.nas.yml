# The stack: one combined app + MongoDB.
#
# akasha, chronos, prithvi and logos run in a single gunicorn behind one origin
# (docker/Dockerfile -> visualizer.wsgi:application): akasha at `/`, chronos at
# `/timeline`, prithvi at `/prithvi`, logos at `/logos`. One published port ->
# one Synology reverse-proxy entry, one cookie, no CORS. `restart:
# unless-stopped` so it survives NAS reboots.
#
# Deploy (from the repo root on the NAS):
#   SECRET_KEY is required — put it in docker/.env (auto-loaded), e.g.
#     SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
#   Then, in Synology Container Manager, create a Project pointing at this file,
#   or on the CLI:
#     docker compose -f docker/docker-compose.nas.yml up --build -d
#
# One port (DSM itself uses 5000/5001, so those are avoided):
#   5002/          -> akasha  (articles/entities, and the shared /login)
#   5002/timeline  -> chronos (the plotline visualiser)
#   5002/prithvi   -> prithvi (the map browser, and the map and pin API)
#   5002/logos     -> logos   (the manuscript reader, and the manuscript API)
# Point one Synology reverse-proxy rule (one hostname) at this port, enable
# HTTPS, then set SESSION_COOKIE_SECURE=true in docker/.env.
#
# To run the services on separate ports instead (development), build
# Dockerfile.akasha / Dockerfile.chronos / Dockerfile.prithvi / Dockerfile.logos
# (visualizer.{akasha,chronos,prithvi,logos}.wsgi).
name: visualizer

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5002:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — set it in docker/.env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      VERSIONS_KEEP: ${VERSIONS_KEEP:-20}
      # In-memory auth rate limiting by default; point at a shared backend (e.g.
      # redis://redis:6379) to hold limits across multiple gunicorn workers.
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      # The service nav's links. Relative paths keep it same-origin; override
      # only if a reverse proxy serves the services on different hosts/paths.
      AKASHA_URL: ${AKASHA_URL:-/}
      CHRONOS_URL: ${CHRONOS_URL:-/timeline}
      PRITHVI_URL: ${PRITHVI_URL:-/prithvi}
      LOGOS_URL: ${LOGOS_URL:-/logos}
      # Prithvi's three numbers. The upload cap bounds one request; the two
      # retention limits bound how much history a map or pin keeps. Map
      # revisions are whole drawings, which is why they are kept fewer.
      PRITHVI_MAX_SVG_BYTES: ${PRITHVI_MAX_SVG_BYTES:-5242880}
      PRITHVI_MAP_REVISIONS_KEEP: ${PRITHVI_MAP_REVISIONS_KEEP:-5}
      PRITHVI_PIN_REVISIONS_KEEP: ${PRITHVI_PIN_REVISIONS_KEEP:-20}
      # How many drafts of each section Logos keeps. Prose is the one thing here
      # that cannot be reconstructed, so this is the most generous retention in
      # the stack -- and an invalid value stops the app rather than silently
      # keeping fewer than asked.
      LOGOS_SECTION_REVISIONS_KEEP: ${LOGOS_SECTION_REVISIONS_KEEP:-20}
      # Observability: per-writer storage/latency/errors in the reserved `_ops`
      # database, plus NAS capacity. Admin-only page at /admin/observability,
      # pausable from there at runtime. `false` here disables it at boot.
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      # Free space is read from this path. It must be the volume MongoDB writes
      # to, which is why mongo-data is mounted read-only below -- measuring the
      # container's own filesystem would report the wrong disk entirely.
      MONITORING_DATA_PATH: /data/mongo
    volumes:
      # Read-only, and only so the capacity sampler can call statvfs on it.
      - mongo-data:/data/mongo:ro
    depends_on:
      mongo:
        condition: service_healthy
    # Laying out a whole series for PDF costs roughly 10 KB of peak memory per
    # word -- over a gigabyte for a long one. Logos turns away a second
    # concurrent render, but a limit here is what stops an unforeseen leak in
    # any of the four services from reaching the database's share.
    mem_limit: ${APP_MEM_LIMIT:-4g}
    restart: unless-stopped

  mongo:
    # mongo:7 requires AVX — fine on the DS1621+ (Ryzen V1500B). On a CPU without
    # AVX (e.g. some Celeron models), change this to mongo:4.4.
    image: mongo:7
    # Left alone, WiredTiger sizes its cache at half of *host* RAM minus a
    # gigabyte -- about 9.5 GB on a 20 GB NAS -- because it cannot see the
    # container's limit. It never needed that much here, and claiming it makes
    # mongod the fattest process on the box, so the OOM killer takes the
    # database first whenever anything else spikes.
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-2}"]
    mem_limit: ${MONGO_MEM_LIMIT:-4g}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  # Project-owned volume: compose names it `visualizer_mongo-data` and manages it
  # (create on first `up`, auto-used thereafter). Existing data was migrated here
  # from the pre-rename `document-server_mongo-data` volume.
  mongo-data: {}
