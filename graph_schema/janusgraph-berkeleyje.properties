# JanusGraph storage configuration.
#
# Uses JanusGraph's default storage backend: BerkeleyDB Java Edition
# (berkeleyje). This is an embedded, on-disk backend, so the graph is
# persisted to `storage.directory` and can be traversed again after the
# server (or container) is restarted.

# Graph factory used by the Gremlin Server to open this graph.
gremlin.graph=org.janusgraph.core.JanusGraphFactory

# Default backend.
storage.backend=berkeleyje

# On-disk location for the graph data. This path is a Docker volume so the
# data survives container restarts (see docker/Dockerfile and README.md).
storage.directory=/opt/janusgraph/data/configurationgraph
graph.graphname=ConfigurationManagementGraph